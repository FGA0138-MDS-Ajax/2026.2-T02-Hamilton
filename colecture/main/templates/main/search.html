{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar livros</title>
    <link rel="stylesheet" href="{% static 'main/css/variables.css' %}" />
    <link rel="stylesheet" href="{% static 'main/css/search.css' %}" />
  </head>

  <body>
    <header class="page-header">
      <a class="link-main" href="{% url 'main:index' %}">
        <img src="{% static 'main/img/logoGato.png' %}" alt="CoLecture" class="logo" />
      </a>
      <a class="link-main" href="{% url 'main:index' %}">
        <span class="logo-text"> Colecture </span>
      </a>
    </header>

    <main class="page-content" data-search-url="{% url 'books:search' %}">
      <h1 class="page-title">Busque por titulo ou autor...</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Busca" />

        <select id="genreFilter">
          <option value="">Todos os gêneros</option>
          {% for genre in genres %}
          <option value="{{ genre }}">{{ genre }}</option>
          {% endfor %}
        </select>

        <button id="searchButton">Buscar</button>
      </div>

      <p id="resultsInfo"></p>

      <div id="bookList"></div>
    </main>

    <script src="{% static 'main/js/search.js' %}"></script>
  </body>
</html>
