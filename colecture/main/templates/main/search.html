{% extends "sidebar.html" %}
{% load static %}

{% block title %}Buscar livros - CoLecture{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'main/css/search.css' %}" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
{% endblock %}

{% block content %}
  <div class="main-box">
    
    {# div (e não main): o sidebar.html já tem um <main> em volta do conteúdo #}
    <div class="page-content" data-search-url="{% url 'books:search' %}">
      <h1 class="page-title">Busque por titulo ou autor...</h1>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Busca" />

        <select id="genreFilter">
          <option value="">Todos os gêneros</option>
          {% for genre in genres %}
          <option value="{{ genre }}">{{ genre }}</option>
          {% endfor %}
        </select>

        <button id="searchButton">Buscar</button>
      </div>

      <p id="resultsInfo"></p>

      <div id="bookList"></div>
    </div>

  </div>

  <script src="{% static 'main/js/search.js' %}"></script>
{% endblock %}
