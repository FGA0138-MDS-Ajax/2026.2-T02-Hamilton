{% extends "sidebar.html" %}

{% block title %}Editar {{ forum.name }} - CoLecture{% endblock %}

{% block content %}
    <p><a href="{% url 'forums:view_forum' forum.id %}">&larr; Voltar para o fórum</a></p>

    <h1>{{ forum.name }}</h1>

    <form action="{% url 'forums:edit_forum' forum.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar alterações</button>
    </form>
{% endblock %}
