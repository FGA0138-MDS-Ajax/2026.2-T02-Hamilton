{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ forum.name }}</title>
</head>
<body>

    <h1>{{ forum.name }}</h1>

    <form action="{% url 'forums:edit_forum' forum.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar alterações</button>
    </form>
    <hr>

</body>
</html>
