{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade</title>
    <link rel="stylesheet" href="{% static 'communities/css/community_view.css' %}" />
</head>
<body>
    {% if community %}
        <p>Nome: <span id="name">{{ community.name }}</span></p>
        <p>Descrição: <span id="name">{{ community.description }}</span></p>
        <form action="{% url 'communities:join_community' community.id %}" method="post">
            {% csrf_token %}
            <button type="submit">Join</button>
        </form>
        <form action="{% url 'communities:leave_community' community.id %}" method="post">
            {% csrf_token %}
            <button type="submit">Leave</button>
        </form>
    {% else %}
        <p>Oops! Não encontramos a comunidade.</p>
    {% endif %}
</body>
</html>
