# ============================================================
# Configuração do MkDocs - CoLecture (Grupo Hamilton)
# Documentação: https://www.mkdocs.org/user-guide/configuration/
# ============================================================

# Identificação do site
site_name: CoLecture
site_description: Documentação do CoLecture, plataforma web de leitura social (MDS 2026.2, UnB)
site_author: Grupo Hamilton
repo_url: https://github.com/FGA0138-MDS-Ajax/2026.2-T02-Hamilton
repo_name: 2026.2-T02-Hamilton

# Menu de navegação (a ordem aqui é a ordem exibida no site)
# Os caminhos são relativos à pasta docs/
nav:
  - Início: index.md
  - Visão do Produto e do Projeto:
      - Produto: visao/produto.md
      - Projeto: visao/projeto.md
      - Escopo e Backlog: visao/escopo.md
      - Métricas (GQM): visao/metricas.md
      - Testes: visao/testes.md
  - Arquitetura:
      - Representação Arquitetural: arquitetura/representacao.md
      - Metas e Restrições: arquitetura/metas-restricoes.md
      - Visões: arquitetura/visoes.md
  - Atas de Reunião:
      - Lista de atas: atas-reuniao/index.md
      - Ata 1: atas-reuniao/ata-reuniao-1.md
      - Ata 2: atas-reuniao/ata-reuniao-2.md
      - Ata 3: atas-reuniao/ata-reuniao-3.md
      - Ata 4: atas-reuniao/ata-reuniao-4.md
      - Ata 5: atas-reuniao/ata-reuniao-5.md
      - Ata 6: atas-reuniao/ata-reuniao-6.md
      - Ata 7: atas-reuniao/ata-reuniao-7.md
  - Sprints:
      - Visão geral: sprints/index.md
      - Sprint 1: sprints/sprint1.md
      - Sprint 2: sprints/sprint2.md
      - Sprint 3: sprints/sprint3.md
      - Sprint 4: sprints/sprint4.md
      - Sprint 5: sprints/sprint5.md
      - Sprint 6: sprints/sprint6.md
      - Sprint 7: sprints/sprint7.md
  - Como contribuir: contribuir.md

# Tema (Material for MkDocs)
# Apenas branco, preto e cinza: as cores ficam em stylesheets/extra.css
theme:
  name: material
  language: pt-BR
  palette:
    scheme: default
    primary: black
  features:
    - navigation.tabs       # seções principais viram abas no topo
    - navigation.top        # botão "voltar ao topo"
    - navigation.sections   # agrupa itens do menu lateral
    - content.code.copy     # botão de copiar nos blocos de código

# CSS extra (paleta preto, branco e cinza)
extra_css:
  - stylesheets/extra.css

# Extensões do Markdown
markdown_extensions:
  - tables                  # tabelas
  - admonition              # blocos de destaque (!!! note)
  - attr_list               # atributos em links e imagens
  - toc:
      permalink: true       # âncora em cada título
